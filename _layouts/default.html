<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | default: "Photography Timer" }}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1f2328;
      background: #ffffff;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 1rem; }
    main h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 1rem; }
    main h2 { margin-top: 2rem; }
    main a { color: #0969da; }
    main ul { padding-left: 1.25rem; }
    main li { margin: 0.25rem 0; }
    .platform-row { display: flex; flex-wrap: wrap; gap: 1.5rem; margin: 1rem 0; align-items: flex-start; }
    .platform-block { flex: 0 0 auto; }
    /* Google's badge PNG has ~41px of transparent padding baked in on every
       side of its 646x250 canvas; Apple's SVG has none. Nudge the Apple
       badge down so the two visible pills line up at the same height. */
    .platform-block:first-child img { margin-top: 11px; }
    main img { max-width: 100%; }
    /* iOS / Android switch for screenshots. CSS only: the checked radio
       hides the other platform's figures on the whole page. Browsers
       without :has() show both platforms. */
    .platform-toggle { display: inline-flex; margin: 0.25rem 0 0.75rem; border: 1px solid #d0d7de; border-radius: 999px; overflow: hidden; }
    .platform-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .platform-toggle label { padding: 0.3rem 1rem; font-size: 0.875rem; cursor: pointer; }
    .platform-toggle input:checked + label { background: #1f2328; color: #ffffff; }
    .platform-toggle input:focus-visible + label { outline: 2px solid #0969da; outline-offset: -2px; }
    main:has(#platform-android:checked) .shot-ios { display: none; }
    main:has(#platform-ios:checked) .shot-android { display: none; }
    /* Screenshots scroll sideways instead of filling the column. */
    .gallery { display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0.25rem 0 0.75rem; margin: 0.75rem 0 1.5rem; }
    .gallery figure { flex: 0 0 200px; margin: 0; scroll-snap-align: start; }
    .gallery img { display: block; width: 100%; height: auto; border: 1px solid #d0d7de; border-radius: 14px; }
    .gallery figcaption { margin-top: 0.4rem; font-size: 0.8125rem; line-height: 1.4; color: #59636e; }
    footer {
      max-width: 720px;
      margin: 2.5rem auto 0;
      padding: 1.25rem;
      border-top: 1px solid #d0d7de;
      font-size: 0.875rem;
      color: #59636e;
    }
    footer p { margin: 0.25rem 0; }
    footer a { color: #59636e; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      main a { color: #4493f8; }
      .platform-toggle { border-color: #30363d; }
      .platform-toggle input:checked + label { background: #e6edf3; color: #0d1117; }
      .gallery img { border-color: #30363d; }
      .gallery figcaption { color: #9198a1; }
      footer { border-top-color: #30363d; color: #9198a1; }
      footer a { color: #9198a1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main>
      {{ content }}
    </main>
  </div>
  <footer>
    <p><a href="./">Home</a> &middot; <a href="release-notes.html">Release Notes</a></p>
    <p>&copy; 2026 Sangwook Han &middot; Photography Timer</p>
  </footer>
</body>
</html>
